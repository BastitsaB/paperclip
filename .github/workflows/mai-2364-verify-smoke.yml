name: MAI-2364 verify smoke (temporary)

on:
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build codex agent-runtime image
        run: |
          docker buildx bake -f docker/agent-runtime/buildx-bake.hcl codex --load
      - name: Smoke test gcloud + codex on PATH as runtime user
        run: |
          docker run --rm ghcr.io/paperclipai/agent-runtime-codex:dev \
            sh -lc 'command -v gcloud && gcloud --version && command -v codex && codex --version'
